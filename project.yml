name: NinebotProPlus
options:
  bundleIdPrefix: com.hanlin
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  NinebotProPlus:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Vendor/kcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hanlin.ninebotpro.plus
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/Support/BridgingHeader.h"
        HEADER_SEARCH_PATHS: "$(SRCROOT)/Vendor/kcp"
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Ninebot Pro+
        CFBundleShortVersionString: "1.0.2"
        CFBundleVersion: "4"
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: 用于连接九号仪表并发送投屏画面（UDP 5012/5013），以及连接 CarWithin 取 CarPlay 画面。
        NSCameraUsageDescription: 用于摄像头画面投屏。
        NSPhotoLibraryUsageDescription: 用于相册图片和视频投屏。
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

schemes:
  NinebotProPlus:
    build:
      targets:
        NinebotProPlus: all
    run:
      config: Debug
    archive:
      config: Release
