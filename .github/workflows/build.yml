name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  APP_NAME: NinebotProPlus
  APP_VERSION: "1.0.3"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive (no codesign)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project $APP_NAME.xcodeproj \
            -scheme $APP_NAME \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/$APP_NAME.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            | tail -n 160

      - name: Package IPA
        run: |
          set -euo pipefail
          IPA="$APP_NAME-$APP_VERSION-carplay-unsigned.ipa"
          mkdir -p build/Payload
          cp -R "build/$APP_NAME.xcarchive/Products/Applications/$APP_NAME.app" build/Payload/
          cd build
          zip -qry "$IPA" Payload
          ls -lh "$IPA"
          # 把版本号写进 artifact 说明，方便核对是不是新包
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" \
            "Payload/$APP_NAME.app/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" \
            "Payload/$APP_NAME.app/Info.plist"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NinebotProPlus-${{ env.APP_VERSION }}-ipa
          path: build/NinebotProPlus-${{ env.APP_VERSION }}-carplay-unsigned.ipa
          if-no-files-found: error

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/NinebotProPlus-${{ env.APP_VERSION }}-carplay-unsigned.ipa
