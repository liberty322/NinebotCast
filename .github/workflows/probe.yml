name: Runner probe

on:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: linux
        run: uname -a && echo "linux ok"

  mac14:
    runs-on: macos-14
    steps:
      - name: mac14
        run: uname -a && sw_vers && echo "mac14 ok"

  mac15:
    runs-on: macos-15
    steps:
      - name: mac15
        run: uname -a && sw_vers && echo "mac15 ok"

  mac15intel:
    runs-on: macos-15-intel
    steps:
      - name: mac15intel
        run: uname -a && sw_vers && echo "mac15intel ok"

  mac13:
    runs-on: macos-13
    steps:
      - name: mac13
        run: uname -a && sw_vers && echo "mac13 ok"

  maclatest:
    runs-on: macos-latest
    steps:
      - name: maclatest
        run: uname -a && sw_vers && echo "maclatest ok"
